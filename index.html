</style></head><body><div id="app"><main style="padding:3rem;font-family:system-ui">Lucys Chemielabor wird geladen …</main></div><script>'use strict';
const TOPICS = [
{
 id:'chemie', group:'01 · Grundlagen', icon:'⚗️', title:'Was ist Chemie?', sub:'Stoffe, Eigenschaften und die Arbeit im Labor', time:8,
 skills:[['taetigkeit','Arbeit der Chemiker:innen'],['stoffe','Stoffe und Eigenschaften'],['reaktion','Chemische Reaktionen']],
 intro:'Chemie ist die Wissenschaft von Stoffen. Sie untersucht, woraus Dinge bestehen, wie sie aufgebaut sind und wie sie sich verändern.',
 blocks:[
  ['Stoffe sind überall','Wasser, Luft, Kupfer, Zucker und Holz bestehen aus Stoffen. Jeder Stoff hat bestimmte <strong>Eigenschaften</strong>: zum Beispiel Farbe, Geruch, Dichte und Schmelzpunkt. Chemiker:innen untersuchen und vergleichen diese Merkmale.'],
  ['Was macht man in der Chemie?','Man beobachtet, stellt Fragen, führt <strong>Experimente</strong> durch und entwickelt <strong>Modelle</strong>. Mit Formeln und Reaktionsgleichungen beschreibt man, was bei einer Reaktion geschieht.'],
  ['Das Wichtigste','Bei einer <strong>chemischen Reaktion</strong> entstehen Stoffe mit neuen Eigenschaften. Beispiel aus den Unterlagen: Ausgangsstoffe (Edukte) reagieren zu Endstoffen (Produkten).']
 ], diagram:'reaction', memory:'Chemie fragt: Welcher Stoff ist es? Wie ist er aufgebaut? Was geschieht, wenn er reagiert?', sources:['Was ist Chemie_.pdf','Womit beschäftigt sich Chemie_.pdf']
},
{
 id:'wechsel',group:'01 · Grundlagen',icon:'🔄', title:'Physikalisch oder chemisch?', sub:'Veränderung erkennen und begründen',time:9,
 skills:[['phys','Physikalische Vorgänge'],['chem','Chemische Vorgänge'],['abgrenz','Begründungen und Grenzfälle']],
 intro:'Bei beiden Vorgängen verändert sich etwas. Die entscheidende Frage lautet: <strong>Entsteht ein neuer Stoff?</strong>',
 blocks:[['Physikalischer Vorgang','Die Stoffart bleibt gleich. Eis schmilzt zu Wasser; Wasser verdunstet. Es bleibt immer H₂O. Auch das Vermischen von Salz und Wasser ist grundsätzlich ein physikalischer Vorgang.'],['Chemischer Vorgang','Es entstehen <strong>neue Stoffe mit anderen Eigenschaften</strong>. Beispiele aus den Unterlagen: Essig + Backpulver (Gasentwicklung) oder eine braune Flüssigkeit, deren Mischung eine andere Farbe annimmt.'],['Wichtig für die Prüfung','Verlass dich nicht nur auf die Farbe! Eine Farbänderung kann ein Hinweis auf eine chemische Reaktion sein, beweist sie aber nicht immer. Begründe mit der <strong>Stoffumwandlung</strong>.']],
 diagram:'reaction',memory:'Physikalisch: kein neuer Stoff. Chemisch: neue Stoffe entstehen.',sources:['Der Unterschied zwischen Chemie und Physik.pdf','Womit beschäftigt sich Chemie_.pdf']
},
{
 id:'modelle',group:'02 · Teilchen',icon:'🧩',title:'Wozu dienen Modelle?',sub:'Stoffebene und Modellebene',time:7,
 skills:[['modell','Eigenschaften eines Modells'],['ebene','Stoffebene und Modellebene']],
 intro:'Ein Modell zeigt etwas Kompliziertes in vereinfachter Form. So können wir uns Dinge vorstellen, die viel zu klein sind, um sie zu sehen.',
 blocks:[['Was ist ein Modell?','Eine <strong>vereinfachte Vorstellung</strong> eines Gegenstands oder Vorgangs. Das Modell ist nicht die Wirklichkeit. Es hebt wichtige Dinge hervor und lässt andere weg.'],['Zwei Betrachtungsebenen','<strong>Stoffebene:</strong> Du beobachtest Wasser im Glas. <strong>Modellebene:</strong> Du zeichnest viele kleine Wasserteilchen. Das sind zwei unterschiedliche Beschreibungen derselben Sache.'],['Beispiel: Wasser und Alkohol','Mischt man 50 ml Wasser mit 50 ml Alkohol, ist das Volumen oft weniger als 100 ml. Im Teilchenmodell können Teilchen sich in Zwischenräume setzen. Es geht nicht darum, dass Teilchen verschwinden.']],diagram:'mixture', memory:'Das Modell erklärt, was man beobachtet. Es ist eine Hilfe – kein Foto der Wirklichkeit.',sources:['Teilchenmodell.pdf']
},
{
 id:'teilchen',group:'02 · Teilchen',icon:'🔬',title:'Das Teilchenmodell',sub:'Aufbau von Stoffen und Zwischenräume',time:8,
 skills:[['grundsatz','Grundaussagen'],['zwischen','Zwischenräume und Mischungen'],['vorstell','Modelldarstellungen verstehen']],
 intro:'Alles besteht aus sehr kleinen Teilchen. Das Teilchenmodell hilft dir zu erklären, warum sich Stoffe mischen, ausbreiten oder ihren Aggregatzustand wechseln.',
 blocks:[['Drei wichtige Aussagen','<strong>1.</strong> Jeder Stoff besteht aus kleinsten Teilchen. <strong>2.</strong> Die Teilchen eines Reinstoffs sind untereinander gleich; verschiedene Stoffe haben verschiedene Teilchen. <strong>3.</strong> Zwischen Teilchen gibt es Zwischenräume.'],['Die Teilchen sind winzig','Bereits ein kleiner Wassertropfen enthält unvorstellbar viele Wasserteilchen. Ein einzelnes Teilchen hat nicht dieselben Stoffeigenschaften wie eine grosse Menge des Stoffes.'],['Eine typische Prüfungsfrage','Warum kann sich das Volumen beim Mischen verringern? Teilchen unterschiedlicher Stoffe können sich dichter anordnen und Zwischenräume ausfüllen.']],diagram:'mixture',memory:'Ein Stoff ist aus Teilchen aufgebaut. Teilchen können unterschiedlich angeordnet sein.',sources:['Teilchenmodell.pdf']
},
{
 id:'zustaende',group:'03 · Wärme und Zustände',icon:'🧊',title:'Die drei Aggregatzustände',sub:'Fest, flüssig und gasförmig',time:8,
 skills:[['fest','Feststoff'],['fluessig','Flüssigkeit'],['gas','Gas und Komprimierbarkeit']],
 intro:'Ein Stoff kann fest, flüssig oder gasförmig sein. Die Teilchen bleiben dieselben; ihre Anordnung und Bewegung ändern sich.',
 blocks:[['Fest','Teilchen liegen nahe und meist geordnet. Sie <strong>schwingen um feste Plätze</strong>. Ein Feststoff behält ungefähr seine eigene Form.'],['Flüssig','Die Teilchen liegen nahe beieinander, können sich aber gegeneinander bewegen. Eine Flüssigkeit hat ein bestimmtes Volumen, nimmt aber die Form ihres Gefässes an.'],['Gasförmig','Die Teilchen bewegen sich weitgehend frei und sind weit voneinander entfernt. Ein Gas füllt den verfügbaren Raum und lässt sich vergleichsweise gut zusammendrücken.'],['Experiment: die Dose','Beim Abkühlen von Wasserdampf in einer Dose kondensiert er zu Wasser. Der Druck innen sinkt; der äussere Luftdruck kann die Dose zusammendrücken.']], diagram:'states',memory:'Fest = feste Plätze. Flüssig = beweglich und dicht. Gas = weit auseinander und frei.',sources:['Aggregatzustände.pdf','Teilchenmodell.pdf']
},
{
 id:'uebergaenge',group:'03 · Wärme und Zustände',icon:'💧',title:'Alle Zustandsübergänge',sub:'Schmelzen, Sieden und mehr',time:9,
 skills:[['waermer','Beim Erwärmen'],['kaelter','Beim Abkühlen'],['direkt','Direkte Übergänge']],
 intro:'Beim Wechsel des Aggregatzustands entsteht <strong>kein neuer Stoff</strong>. Es ändern sich Teilchenanordnung und Beweglichkeit.',
 blocks:[['Beim Erwärmen','<strong>Schmelzen:</strong> fest → flüssig. <strong>Verdampfen:</strong> flüssig → gasförmig. <strong>Sublimieren:</strong> fest → gasförmig (z. B. Trockeneis bei Normaldruck).'],['Beim Abkühlen','<strong>Erstarren:</strong> flüssig → fest. <strong>Kondensieren:</strong> gasförmig → flüssig. <strong>Resublimieren:</strong> gasförmig → fest (z. B. Reif).'],['Eine Stolperfalle','Verdunsten ist Verdampfen <em>unterhalb des Siedepunkts</em> an der Flüssigkeitsoberfläche. Sieden betrifft die Flüssigkeit als Ganzes; dabei bilden sich Dampfblasen.']],diagram:'transitions',memory:'Lerne die sechs Pfeile: schmelzen, erstarren, verdampfen, kondensieren, sublimieren, resublimieren.',sources:['Aggregatzustände.pdf','Teilchenbewegung.pdf']
},
{
 id:'bewegung',group:'03 · Wärme und Zustände',icon:'🌡️',title:'Temperatur, Teilchen und Druck',sub:'Bewegung verstehen statt auswendig lernen',time:10,
 skills:[['temperatur','Temperatur und Bewegung'],['druck','Gasdruck'],['null','Absoluter Nullpunkt']],
 intro:'Temperatur hängt mit der <strong>durchschnittlichen Bewegungsenergie</strong> von Teilchen zusammen. Gasdruck entsteht, wenn Teilchen gegen Wände stossen.',
 blocks:[['Was bedeutet warm?','Im Durchschnitt bewegen oder schwingen Teilchen bei höherer Temperatur heftiger. Nicht alle Teilchen sind zu einem Zeitpunkt gleich schnell.'],['Warum drückt ein Gas?','Gasteilchen bewegen sich und stossen immer wieder gegen die Gefässwände. Viele solche Stösse erzeugen den messbaren <strong>Druck</strong>.'],['Was ist 0 Kelvin?','Der absolute Nullpunkt entspricht <strong>0 K = −273,15 °C</strong>. Er ist eine theoretische untere Grenze der Temperatur.'],['Wichtig','Auch bei Raumtemperatur bewegen sich Teilchen. Ein Gas kann bei Erwärmung mehr Druck ausüben, wenn sein Gefäss geschlossen und starr bleibt.']],diagram:'states',memory:'Höhere Temperatur → im Mittel mehr Bewegungsenergie. Gasdruck → Stösse an Gefässwände.',sources:['Teilchenbewegung.pdf']
},
{
 id:'kurve',group:'03 · Wärme und Zustände',icon:'📈',title:'Erwärmungskurven lesen',sub:'Warum bleibt die Temperatur manchmal gleich?',time:11,
 skills:[['anstieg','Steigende Kurven'],['plateau','Plateaus und Energie'],['werte','Schmelz- und Siedepunkt']],
 intro:'Wenn wir Eis erwärmen, steigt die Temperatur nicht immer gleichmässig. Beim Schmelzen und Sieden entstehen <strong>waagrechte Abschnitte</strong>.',
 blocks:[['Steigende Linie','Innerhalb eines Aggregatzustands nimmt die Temperatur zu: Die mittlere Bewegungsenergie der Teilchen steigt.'],['Waagrechte Linie (Plateau)','Beim Schmelzen oder Sieden wird weiterhin Energie zugeführt. Sie wird für das Lösen beziehungsweise Überwinden von Teilchenanziehungen gebraucht. Die Temperatur bleibt während des Übergangs konstant (bei gleichem Druck).'],['Zahlen aus den Unterlagen','Wasser schmilzt bei etwa <strong>0 °C</strong> und siedet bei <strong>100 °C</strong> bei Normaldruck. Blei schmilzt bei <strong>327 °C</strong> und siedet laut Aufgabenblatt bei <strong>1740 °C</strong>. Trockeneis sublimiert bei etwa <strong>−78 °C</strong>.']],diagram:'curve',memory:'Steigend = Temperatur steigt. Waagrecht = Zustandswechsel trotz weiterer Energiezufuhr.',sources:['Teilchenbewegung.pdf']
},
{
 id:'reinstoff',group:'04 · Stoffgemische',icon:'🧪',title:'Reinstoff oder Gemisch?',sub:'Eine oder mehrere Teilchensorten',time:9,
 skills:[['rein','Reinstoff erkennen'],['gemisch','Gemisch erkennen'],['mischen','Stoffe beim Mischen']],
 intro:'Ein Reinstoff besteht aus <strong>einer Art von Teilchen</strong>. Ein Gemisch enthält <strong>mindestens zwei verschiedene Teilchensorten</strong>.',
 blocks:[['Reinstoff','Reines Wasser besteht aus Wasserteilchen (H₂O). Auch reiner Sauerstoff ist ein Reinstoff, obwohl jedes Sauerstoffmolekül aus zwei Atomen besteht.'],['Gemisch','Luft besteht aus verschiedenen Gasen. Salzwasser enthält Wasserteilchen und gelöste Salzteilchen. Die Zusammensetzung kann verschieden sein.'],['Mischen ist nicht automatisch eine Reaktion','Beim Mischen bleiben die Bestandteile meist chemisch dieselben. Löst du Zucker in Wasser, entsteht nicht plötzlich ein neuer Stoff. Beide Teilchensorten bleiben vorhanden.']],diagram:'mixture',memory:'Es zählt die Zahl der Teilchensorten – nicht, ob ein Teilchen aus mehreren Atomen besteht.',sources:['Reinstoffe und Gemische.pdf']
},
{
 id:'homogen',group:'04 · Stoffgemische',icon:'👀',title:'Homogen oder heterogen?',sub:'Gleichmässig oder sichtbar unterschiedlich?',time:9,
 skills:[['homo','Homogene Gemische'],['hetero','Heterogene Gemische'],['beispiele','Alltagsbeispiele einordnen']],
 intro:'Bei einem <strong>homogenen</strong> Gemisch kann man die verschiedenen Bestandteile nicht getrennt erkennen. Bei einem <strong>heterogenen</strong> Gemisch gibt es unterscheidbare Bereiche.',
 blocks:[['Homogen = einheitlich','Zuckerwasser, Luft, Messing: Das Gemisch erscheint überall gleich zusammengesetzt. Mit blossen Augen sieht man keine getrennten Bestandteile.'],['Heterogen = uneinheitlich','Öl und Wasser, Orangensaft mit Fruchtfleisch oder Granit: Hier lassen sich unterschiedliche Bestandteile oder Phasen unterscheiden.'],['Ein häufiger Irrtum','Ein <strong>homogenes Gemisch ist kein Reinstoff</strong>. Auch wenn es vollständig gleichmässig aussieht, enthält es verschiedene Teilchensorten.']],diagram:'mixture',memory:'Homo = gleichmässig. Hetero = unterscheidbare Phasen oder Bestandteile.',sources:['Reinstoffe und Gemische.pdf']
},
{
 id:'gemischarten',group:'04 · Stoffgemische',icon:'🫧',title:'Die Namen der Gemischtypen',sub:'Suspension, Emulsion, Nebel & Co.',time:11,
 skills:[['heterotyp','Heterogene Gemischtypen'],['homotyp','Homogene Gemischtypen'],['phasentyp','Stoffzustände der Bestandteile']],
 intro:'Gemische werden je nach den Aggregatzuständen ihrer Bestandteile genauer benannt. Die Fachbegriffe sind beliebte Prüfungsfragen.',
 blocks:[['Heterogene Gemische','<strong>Gemenge:</strong> fest/fest (Granit). <strong>Suspension:</strong> fest in flüssig (Orangensaft mit Fruchtfleisch). <strong>Emulsion:</strong> flüssig in flüssig (Milch). <strong>Rauch:</strong> fest in Gas. <strong>Nebel:</strong> flüssig in Gas. <strong>Schaum:</strong> Gas in Flüssigkeit.'],['Homogene Gemische','<strong>Legierung:</strong> fest/fest (Messing). <strong>Gasgemisch:</strong> Gas/Gas (Luft). <strong>Lösung:</strong> z. B. Zucker in Wasser, Alkohol in Wasser oder CO₂ in Mineralwasser.'],['Merke die Richtung','Nebel sind <em>Flüssigkeitströpfchen in einem Gas</em>, Schaum ist <em>Gas in einer Flüssigkeit</em>. Diese beiden werden leicht verwechselt.']],diagram:'mixture',memory:'Milch = Emulsion, Fruchtfleischsaft = Suspension, Luft = Gasgemisch, Messing = Legierung.',sources:['Reinstoffe und Gemische.pdf']
},
{
 id:'typen',group:'05 · Atome',icon:'🔗',title:'Atome, Moleküle und Ionen',sub:'Drei Arten kleinster Teilchen',time:11,
 skills:[['atom','Atome'],['molekuel','Moleküle'],['ion','Ionen']],
 intro:'Die Unterlagen unterscheiden <strong>Atome</strong>, <strong>Moleküle</strong> und <strong>Ionen</strong>. Entscheidend ist, wie die Teilchen aufgebaut und ob sie elektrisch geladen sind.',
 blocks:[['Atom','Ein Atom ist ein chemischer Grundbaustein. Beispiele aus dem Blatt: einzelne Neonatome, Kupferatome in festem Kupfer oder Quecksilberatome.'],['Molekül','Ein Molekül besteht aus <strong>mindestens zwei verbundenen Atomen</strong>. O₂ enthält zwei Sauerstoffatome; H₂O enthält zwei Wasserstoffatome und ein Sauerstoffatom. Moleküle sind insgesamt ungeladen.'],['Ion','Ein Ion ist ein elektrisch geladenes Teilchen. Ein <strong>Kation</strong> ist positiv (+), ein <strong>Anion</strong> negativ (−). Kaliumiodid enthält Ionen; die Ladungen ziehen sich an.']],diagram:'molecules',memory:'Atom = Einzelbaustein. Molekül = verbundene Atome. Ion = elektrisch geladen.',sources:['3 Typen kleinster Teilchen.pdf']
},
{
 id:'atomaufbau',group:'05 · Atome',icon:'⚛️',title:'Protonen, Neutronen, Elektronen',sub:'Atomkern und Atomhülle',time:10,
 skills:[['ladung','Ladung der Teilchen'],['ort','Ort im Atom'],['neutral','Neutrale Atome und Ionen']],
 intro:'Im Atomkern sitzen <strong>Protonen (+)</strong> und <strong>Neutronen (neutral)</strong>. In der Atomhülle befinden sich <strong>Elektronen (−)</strong>.',
 blocks:[['Kern und Hülle','Der Kern enthält fast die gesamte Masse des Atoms. Elektronen sind viel leichter und befinden sich in der Hülle. Die Zeichnung ist ein vereinfachtes Modell.'],['Elektrische Ladung','Bei einem <strong>neutralen Atom</strong> gilt: Zahl Protonen = Zahl Elektronen. Bei einem Ion ist die Elektronenzahl anders.'],['Warum wird ein Atom zum Ion?','Wenn es Elektronen <strong>abgibt</strong>, wird es positiv. Wenn es Elektronen <strong>aufnimmt</strong>, wird es negativ. Die Zahl der Protonen bleibt bei gewöhnlichen chemischen Vorgängen gleich.']],diagram:'atom',memory:'Proton +, Neutron 0, Elektron −. Positive Ionen haben zu wenige Elektronen.',sources:['Elementarteilchen.pdf','Elementarteilchen 2.pdf']
},
{
 id:'pse',group:'05 · Atome',icon:'🗂️',title:'Das Periodensystem',sub:'Symbole, Ordnungszahl und Elemente',time:10,
 skills:[['symbol','Elementsymbole'],['ordnung','Ordnungszahl'],['element','Element und Verbindung']],
 intro:'Das Periodensystem (PSE) ordnet die chemischen Elemente. Jedes Element hat einen Namen, ein Symbol und eine <strong>Ordnungszahl</strong>.',
 blocks:[['Das verrät die Ordnungszahl','Sie gibt die <strong>Zahl der Protonen</strong> im Kern an. Ein neutrales Atom hat ebenso viele Elektronen. Beispiel: Sauerstoff O, Ordnungszahl 8 → acht Protonen und acht Elektronen.'],['Symbole lesen','H = Wasserstoff, O = Sauerstoff, C = Kohlenstoff, N = Stickstoff, Fe = Eisen, Cu = Kupfer, Na = Natrium, Cl = Chlor, Mg = Magnesium. Gross- und Kleinschreibung sind wichtig!'],['Element oder Verbindung?','Ein Element besteht aus Atomen einer einzigen Atomsorte (z. B. O₂). Eine Verbindung enthält verschiedene Atomsorten, die chemisch verbunden sind (z. B. H₂O).']],diagram:'pse',memory:'Ordnungszahl = Protonenzahl. Bei neutralen Atomen auch Elektronenzahl.',sources:['PSE.pdf','Was ist Chemie_.pdf','Elementarteilchen.pdf']

function enc(t){return String(t).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}

function save(){
 state.events=state.events.slice(-1400); state.rounds=state.rounds.slice(-250);
 try {localStorage.setItem(KEY,JSON.stringify(state));storageMode='Lokaler Browserspeicher';} catch(e){storageMode='Speichern eingeschränkt';}
 try {
  const tally=TOPICS.map(t=>[t.id,t.skills.map(([skill])=>{const e=state.events.filter(x=>x.topic===t.id&&x.skill===skill).slice(-12);return [skill,e.length,e.filter(x=>x.correct).length];})]);
  const compact={v:2,at:Date.now(),t:tally};
  document.cookie=COOKIE+'='+encodeURIComponent(JSON.stringify(compact))+'; max-age=31536000; path=/; SameSite=Lax';
  if(document.cookie.includes(COOKIE+'='))storageMode='Browserspeicher + Cookie';
 }catch(e){}
}
function load(){
 try{const loaded=JSON.parse(localStorage.getItem(KEY)||'null');if(loaded&&Array.isArray(loaded.events)){

 state.rounds=Array.isArray(loaded.rounds)?loaded.rounds:[];state.created=loaded.created||Date.now();storageMode='Lokaler Browserspeicher';return;
 }}catch(e){}
 const c=readCookie();if(c&&Array.isArray(c.t)){ // nur verdichtete Werte verfügbar
  c.t.forEach(([id,stats])=>{
   const t=TOPICS.find(x=>x.id===id);if(!t||!Array.isArray(stats))return;
   stats.forEach(([skill,total,ok])=>{
    if(!t.skills.some(s=>s[0]===skill)||!Number.isFinite(total)||total<=0)return;
    const lim=Math.min(12,total),good=Math.round(Math.min(1,ok/total)*lim);
    for(let i=0;i<lim;i++)state.events.push({topic:id,skill,correct:i<good,ts:c.at||Date.now(),recovered:true});
   });
  });storageMode='Cookie (zusammengefasste Unterthemen)';
 }
}
function groupEvents(topic,skill){return state.events.filter(e=>(!topic||e.topic===topic)&&(!skill||e.skill===skill));}
function getSkill(topic,skill){
 const ev=groupEvents(topic,skill).slice(-12);
 const n=ev.length, rate=n?ev.filter(x=>x.correct).length/n:0;
 const confidence=Math.min(1,n/4);
 const mastery=Math.round(rate*confidence*100);
 const status=!n?'Offen':(n<4?'Noch üben':rate>=.80?'Sicher':rate>=.6?'Fast sicher':'Wiederholen');
 return {n,rate,confidence,mastery,status,correct:ev.filter(x=>x.correct).length};
}
function getTopic(id){const t=TOPICS.find(x=>x.id===id);if(!t)return null;
 const s=t.skills.map(([key,label])=>({key,label,...getSkill(id,key)}));
 const all=groupEvents(id), val=Math.round(s.reduce((a,x)=>a+x.mastery,0)/s.length);
 return {...t,skillStats:s,mastery:val,n:all.length,rate:all.length?all.filter(x=>x.correct).length/all.length:0,rounds:state.rounds.filter(x=>x.topic===id).length};
}
function overview(){

function currentQuiz(){if(!currentTest)return '';
 const t=getTopic(currentTest.topic), at=currentTest.index, q=currentTest.items[at], finished=!!currentTest.reveal;
 const chosen=currentTest.selected;
 return `<div class="quiz-page"><button class="back-link" data-quit>← Zurück zum Thema</button><div class="quiz-head"><div><span class="eyebrow">MINI-TEST · ${enc(t.title)}</span><h1>Zeig, was du weisst.</h1><p>Frage ${at+1} von ${currentTest.items.length} · Eine Antwort auswählen</p></div><span class="quiz-counter">${at+1} / ${currentTest.items.length}</span></div><div class="quiz-progress">${Array.from({length:currentTest.items.length},(_,i)=>`<span class="${i<=at?'active':''}"></span>`).join('')}</div><article class="question-panel"><span class="question-topic">${enc(t.skills.find(x=>x[0]===q.skill)?.[1]||'Wissensfrage')}</span><h2>${enc(q.prompt)}</h2><div class="choices">${currentTest.options.map((c,i)=>{
  const className=finished?(c===q.correct?'correct':c===chosen?'wrong':''):(c===chosen?'selected':'');
  return `<button class="choice ${className}" data-answer="${i}" ${finished?'disabled':''}><span class="choice-letter">${'ABCD'[i]}</span><span>${enc(c)}</span>${finished&&c===q.correct?'<span class="answer-status">✓</span>':''}${finished&&c===chosen&&chosen!==q.correct?'<span class="answer-status">×</span>':''}</button>`;
 }).join('')}</div>${finished?`<div class="feedback ${chosen===q.correct?'feedback-yes':'feedback-no'}"><strong>${chosen===q.correct?'✓ Genau richtig!':'↻ Das schauen wir nochmals an'}</strong><p>${enc(q.why)}</p>${chosen!==q.correct?`<small>Richtig ist: ${enc(q.correct)}</small>`:''}</div>`:''}<div class="quiz-buttons"><span class="little">${finished?'Weiter geht’s':'Tippe auf eine Antwort'}</span>${finished?`<button class="btn primary" data-next>${at===currentTest.items.length-1?'Auswertung ansehen →':'Nächste Frage →'}</button>`:''}</div></article><p class="quiz-help">Du bekommst direkt eine Erklärung, auch wenn die Antwort nicht stimmt. Fehler gehören zum Lernen dazu.</p></div>`;
}
function prepareQuiz(tid,focus){const t=getTopic(tid);if(!t)return;
 let available=QUESTIONS.filter(q=>q.topic===tid);
 const selected=[],taken=new Set();
 const skillIds=t.skills.map(s=>s[0]);
 const recent=state.events.slice(-70).map(e=>e.question).filter(Boolean);
 const weight=q=>{const s=getSkill(tid,q.skill);let w=1+(1-s.rate)*1.3;if(s.n===0)w+=.5;if(recent.slice(-8).includes(q.id))w*=.06;else if(recent.includes(q.id))w*=.48;return w;};
 function draw(pool){const options=pool.filter(q=>!taken.has(q.id));if(!options.length)return;
  const ws=options.map(x=>Math.max(.01,weight(x))),sum=ws.reduce((a,b)=>a+b,0);let r=Math.random()*sum;let v=options[0];for(let i=0;i<options.length;i++){r-=ws[i];if(r<=0){v=options[i];break;}}
  selected.push(v);taken.add(v.id);
 }
 if(focus){for(let i=0;i<4;i++)draw(available.filter(x=>x.skill===focus));}
 for(let layer=0;layer<3;layer++)for(const skill of shuffle(skillIds))if(selected.length<TEST_SIZE)draw(available.filter(x=>x.skill===skill));
 while(selected.length<TEST_SIZE)draw(available);
 currentTest={topic:tid,focus,items:shuffle(selected),index:0,selected:null,reveal:false,answers:[],options:[]};
 setupQuestion();page='quiz';render();window.scrollTo(0,0);
}
function setupQuestion(){if(currentTest){currentTest.selected=null;currentTest.reveal=false;currentTest.options=shuffle(currentTest.items[currentTest.index].choices);}}
function chooseAnswer(i){if(!currentTest||currentTest.reveal)return;
 const q=currentTest.items[currentTest.index],c=currentTest.options[i];if(c===undefined)return;
 currentTest.selected=c;currentTest.reveal=true;currentTest.answers.push({question:q.id,topic:q.topic,skill:q.skill,correct:c===q.correct,ts:Date.now()});render();
}
function nextQuestion(){if(!currentTest||!currentTest.reveal)return;
 if(currentTest.index<currentTest.items.length-1){currentTest.index++;setupQuestion();render();window.scrollTo({top:0,behavior:'instant'});}
 else{finishQuiz();}
}
function finishQuiz(){
 const t=currentTest.topic,answers=currentTest.answers;
 state.events.push(...answers);state.rounds.push({topic:t,correct:answers.filter(x=>x.correct).length,total:answers.length,ts:Date.now(),focus:currentTest.focus||null});save();
 testResult={topic:t,answers,correct:answers.filter(x=>x.correct).length,total:answers.length,focus:currentTest.focus};
 page='result';currentTest=null;render();window.scrollTo(0,0);
}
function resultsView(){if(!testResult){page='home';return home();}
 const t=getTopic(testResult.topic),rate=testResult.correct/testResult.total;
 const text=rate===1?'Stark! Alle sechs Fragen richtig.':rate>=.67?'Du hast schon viel verstanden.':rate>=.34?'Guter Anfang! Ein paar Stellen üben wir nochmals.':'Kein Problem: Mit einer Wiederholung wird es klarer.';
 const local=t.skills.map(([k,label])=>{const a=testResult.answers.filter(x=>x.skill===k),correct=a.filter(x=>x.correct).length;return {key:k,label,count:a.length,correct};}).filter(x=>x.count>0);
 const weak=local.filter(x=>x.correct<x.count);
 return `<div class="result-page"><button class="back-link" data-nav="thema/${t.id}">← Zum Lernstoff</button><section class="result-hero"><div class="party-icon">${rate===1?'🎉':rate>=.5?'🌱':'💡'}</div><span class="eyebrow">MINI-TEST ABGESCHLOSSEN</span><h1>${text}</h1><p><strong>${testResult.correct} von ${testResult.total}</strong> Fragen richtig. Dein Fortschritt wurde auf diesem Gerät gespeichert.</p><div class="result-score">${circleHTML(Math.round(rate*100),'richtig im Test')}<div><span>Fortschritt im Thema</span><strong>${t.mastery}%</strong><small>Mehrere gute Tests festigen dein Wissen.</small></div></div></section><section class="result-analysis"><h2>Das hast du verstanden</h2><div class="subresults">${local.map(x=>`<div class="subresult"><span class="sub-dot ${x.correct===x.count?'ok':'needs'}">${x.correct===x.count?'✓':'↻'}</span><div><strong>${enc(x.label)}</strong><span>${x.correct} von ${x.count} richtig ${x.correct===x.count?'· Das klappt schon!':'· Noch etwas üben'}</span></div></div>`).join('')}</div>
 <h2>${weak.length?'Hier kannst du gezielt nachbessern':'Was ist als Nächstes sinnvoll?'}</h2><p>${weak.length?'Diese Unterthemen waren im letzten Test noch nicht sicher. Wiederhole die Erklärung und mache danach neue Fragen.':'Versuche einen zweiten Kurztest mit anderen Fragen. Erst durch wiederholte richtige Antworten wird ein Thema wirklich sicher.'}</p><div class="result-actions">${weak.length?`<button class="btn primary" data-focus="${t.id}:${weak[0].key}">Schwächstes Unterthema üben →</button>`:`<button class="btn primary" data-start="${t.id}">Noch einen Test machen →</button>`}<button class="btn secondary" data-nav="thema/${t.id}">Erklärung nochmals ansehen</button><button class="btn ghost" data-nav="home">Zur Übersicht</button></div></section></div>`;
}
function analysis(){const o=overview(), weakest=o.topics.filter(t=>t.n>0).sort((a,b)=>a.mastery-b.mastery);
 const sc=o.score;
 return `<div class="analysis-page"><button class="back-link" data-nav="home">← Zur Startseite</button><header class="analysis-header"><span class="eyebrow">DEINE LERNANALYSE</span><h1>Was sitzt schon – und was noch nicht?</h1><p>Hier siehst du nicht nur Testergebnisse, sondern auch, <strong>welches Unterthema</strong> du nochmals anschauen solltest.</p></header><section class="analysis-summary"><div class="analysis-meter">${circleHTML(sc,'Lernfortschritt')}<div><strong>Gesamtfortschritt</strong><p>Der Balken steigt mit richtigen Antworten und erneuten erfolgreichen Tests. Noch nie geprüfte Themen zählen als <em>offen</em>.</p></div></div><div class="analysis-facts"><div><strong>${o.tested}/${TOPICS.length}</strong><span>Themen ausprobiert</span></div><div><strong>${o.accuracy===null?'–':o.accuracy+'%'}</strong><span>Antworten richtig</span></div><div><strong>${o.solid}</strong><span>Themen gut gefestigt</span></div></div></section>
 ${o.answered?`<section class="next-steps"><h2>Deine nächsten sinnvollen Schritte</h2><div class="next-cards">${weakest.slice(0,3).map(t=>`<button data-nav="thema/${t.id}"><span>${t.icon} ${enc(t.title)}</span><strong>${t.mastery}% gefestigt</strong><small>${t.skillStats.filter(x=>x.status==='Wiederholen'||x.status==='Noch üben').length} Unterthemen brauchen Übung · →</small></button>`).join('')}</div></section>`:`<section class="next-steps"><h2>Starte zuerst einen Kurztest</h2><p>Danach erscheinen hier persönliche Empfehlungen auf Grundlage deiner Antworten.</p><button class="btn primary" data-nav="thema/chemie">Mit Chemie beginnen →</button></section>`}
 <section class="deep-analysis"><div class="section-heading"><div><h2>Alle Themen im Detail</h2><p>Klappe ein Thema auf, um seine einzelnen Lernziele zu sehen.</p></div></div><div class="analyse-list">${o.topics.map((t,i)=>`<details class="analyse-topic" ${o.answered&&t.n>0&&t.mastery<60?'open':''}><summary><span class="analysis-list-ico">${t.icon}</span><span class="analysis-name"><strong>${enc(t.title)}</strong><small>${t.n?`${t.n} Antworten · ${Math.round(t.rate*100)}% richtig`:'Noch nicht getestet'}</small></span><span class="analysis-trackbar">${progressBar(t.mastery,t.title)}</span><b>${t.mastery}%</b><span class="chevron">⌄</span></summary><div class="analyse-expanded"><p class="analysis-note">${!t.n?'Noch keine Testantworten. Erst nach einem Kurztest ist eine Einschätzung möglich.':t.mastery>=80?'Dieses Thema ist recht gut gefestigt. Andere Fragen bleiben trotzdem sinnvoll.':'Der Wert berücksichtigt richtige Antworten UND wie oft du sie bereits sicher gezeigt hast.'}</p>${t.skillStats.map(s=>`<div class="skill-detail"><div class="skill-detail-heading"><strong>${enc(s.label)}</strong><span class="${s.status==='Sicher'?'tone-good':s.n?'tone-warn':'tone-neutral'}">${s.status}</span></div>${progressBar(s.mastery,s.label)}<div class="skill-detail-foot"><small>${s.n?`${s.correct} von ${s.n} (letzte max. 12 Fragen) richtig`:'Noch nicht geprüft'}</small><button class="tiny-btn" data-focus="${t.id}:${s.key}">Gezielt testen ↗</button></div></div>`).join('')}<button class="btn secondary" data-nav="thema/${t.id}">Lernstoff ansehen →</button></div></details>`).join('')}</div></section>
 <section class="methodology"><h2>So wird dein Lernstand berechnet</h2><p>Jedes Unterthema erhält maximal 100 Punkte. Dabei zählen <strong>Trefferquote</strong> und <strong>Wiederholungssicherheit</strong>: Erst ab vier beantworteten Fragen pro Unterthema kann es 100 Punkte erreichen. Für die aktuelle Einschätzung werden jeweils die letzten zwölf Antworten betrachtet. Der Gesamtwert ist der Durchschnitt aller 15 Themen. Noch nicht getestete Unterthemen bleiben als offen markiert. Das ist ein Lernbarometer, keine Schulnote.</p><details><summary>Datenschutz und Speichern</summary><p>Deine Antworten bleiben lokal in deinem Browser. Sie werden nicht an einen Server geschickt. Auf einer Website wird zusätzlich eine kleine Zusammenfassung in einem Cookie abgelegt; beim direkten Öffnen einer HTML-Datei verhindern manche Browser Cookies. Dann übernimmt der lokale Browserspeicher. Ein anderer Browser, privates Fenster oder das Löschen von Browserdaten kann den Fortschritt entfernen. Nutze deshalb bei Bedarf die Datensicherung unten.</p></details><div class="data-buttons"><button class="btn secondary" data-export>Fortschritt sichern (.json)</button><button class="btn secondary" data-import>Fortschritt laden (.json)</button><button class="btn danger" data-reset>Alles zurücksetzen</button></div><small id="storageStatus">Speicherstatus: ${enc(storageMode||'Lokaler Browserspeicher')}</small><input id="importFile" type="file" accept="application/json,.json" hidden /></section></div>`;
}
function render(){const root=byId('app');if(!root)return;
 const hash=location.hash.replace(/^#/,'');if(page!=='quiz'&&page!=='result')page=hash||'home';
 let main;if(page==='home')main=home();else if(page==='analyse')main=analysis();else if(page.startsWith('thema/'))main=topicView(page.slice(6));else if(page==='quiz')main=currentQuiz();else if(page==='result')main=resultsView();else{page='home';main=home();}
 root.innerHTML=`<div class="app-shell"><aside class="sidebar"><div class="brand" data-nav="home" role="button" tabindex="0" aria-label="Zur Übersicht"><span class="brand-icon">⚛</span><span><strong>LUCYS LABOR</strong><small>Die Chemie-Lernwelt</small></span></div><div class="sidebar-caption">DEINE THEMEN</div>${navLinks()}<div class="side-bottom"><div class="side-footer">✨ Schritt für Schritt besser</div><small>Vollständig offline nutzbar</small></div></aside><div class="workspace"><header class="mobile-top"><button class="brand mobile-brand" data-nav="home"><span class="brand-icon">⚛</span><strong>LUCYS LABOR</strong></button><button class="mobile-menu-btn" data-menu aria-label="Menü öffnen">☰ Themen</button></header><main class="main-content">${main}</main><footer class="footer"><span>Mit Liebe zum Verstehen gemacht ✦</span><span>Aus Lucys Chemie-Unterlagen · 13 Jahre · ${QUESTIONS.length} Übungsfragen</span></footer></div></div><div class="mobile-shade" id="shade" data-menu></div>`;
 const slider=byId('heatSlider');if(slider) {slider.addEventListener('input',setHeat);setHeat();}
 if(page!=='quiz')byId('mobileNav')?.classList.remove('open');
 document.title=(page.startsWith('thema/')?TOPICS.find(t=>t.id===page.slice(6))?.title+' · ':page==='analyse'?'Lernanalyse · ':'')+'Lucys Labor – Chemie lernen';
}
function setHeat(){const r=byId('heatSlider');if(!r)return;const n=Number(r.value),names=['Sehr kalt','Kühl','Mittelwarm','Warm','Sehr warm'];const descriptions=['Teilchen bewegen sich langsam.','Die Bewegung wird etwas heftiger.','Die Teilchen bewegen sich.','Die Teilchen bewegen sich schneller.','Die Teilchen sind besonders schnell unterwegs.'];
 byId('heatLabel').textContent=names[n-1];byId('heatDesc').textContent=descriptions[n-1];byId('gasBox').style.setProperty('--duration',(7.2-n*1.13)+'s');}
function exportProgress(){const blob=new Blob([JSON.stringify({app:'Lucys Chemielabor',version:1,exported:new Date().toISOString(),state},null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='Lucys-Chemie-Fortschritt.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),30000);}
function importProgress(file){if(!file)return;const r=new FileReader();r.onload=()=>{try{const v=JSON.parse(r.result);if(v.version!==1||!v.state||!Array.isArray(v.state.events))throw Error('Dateiformat');
 const safe=v.state.events.filter(x=>x&&TOPICS.some(t=>t.id===x.topic&&t.skills.some(s=>s[0]===x.skill))&&typeof x.correct==='boolean'&&Number.isFinite(x.ts));
 if(!confirm(`${safe.length} gespeicherte Antworten importieren? Der bisherige Lernstand wird ersetzt.`))return;
 state.events=safe;state.rounds=Array.isArray(v.state.rounds)?v.state.rounds.filter(x=>TOPICS.some(t=>t.id===x.topic)):[];state.created=v.state.created||Date.now();save();render();alert('Lernstand erfolgreich geladen.');
 }catch(e){alert('Diese Datei ist keine gültige Sicherung von Lucys Chemielabor.');}};r.readAsText(file);}
function toggleMenu(){document.body.classList.toggle('menu-open')}
document.addEventListener('click',e=>{
 const el=e.target.closest('button,[data-nav],[data-quit],[data-menu]');if(!el)return;
 if(el.hasAttribute('data-menu')){toggleMenu();return;}
 const go=el.getAttribute('data-nav');if(go){if(currentTest&&!confirm('Den laufenden Test wirklich verlassen? Deine bisherigen Antworten werden noch nicht gespeichert.'))return;
 currentTest=null;testResult=null;document.body.classList.remove('menu-open');nav(go);return;}
 if(el.hasAttribute('data-quit')){if(currentTest&&!confirm('Laufenden Test abbrechen?'))return;const id=currentTest?.topic;currentTest=null;testResult=null;page='home';nav('thema/'+id);return;}
 if(el.hasAttribute('data-start')){prepareQuiz(el.getAttribute('data-start'),null);return;}
 if(el.hasAttribute('data-focus')){const [id,skill]=el.getAttribute('data-focus').split(':');prepareQuiz(id,skill);return;}
 if(el.hasAttribute('data-answer')){chooseAnswer(Number(el.getAttribute('data-answer')));return;}
 if(el.hasAttribute('data-next')){nextQuestion();return;}
 if(el.hasAttribute('data-export')){exportProgress();return;}
 if(el.hasAttribute('data-import')){byId('importFile')?.click();return;}
 if(el.hasAttribute('data-reset')){if(confirm('Wirklich alle gespeicherten Antworten und Fortschritte auf diesem Gerät löschen?')){state.events=[];state.rounds=[];save();render();}return;}
});
document.addEventListener('change',e=>{if(e.target.id==='importFile'){importProgress(e.target.files[0]);e.target.value='';}});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.classList?.contains('brand'))nav('home');});
window.addEventListener('hashchange',()=>{if(page==='quiz'){return;}page=location.hash.replace(/^#/,'')||'home';render();window.scrollTo(0,0);});
load();render();
</script></body></html>
